<style>
/* VOICE: after-hours screening room — sleek, cinematic, quiet confidence.
   IDEA: a poster wall in a dark lobby; tap a one-sheet and it steps forward under a spotlight.
   PICTURE: the posters themselves, edge to edge, tight checkerboard.
   COLOUR and TYPE: near-black with a faint crimson glow, bone text, crimson accent, gold stars; Copperplate Gothic headers, Inter body.
   LAYOUT: one slim glass bar (title, search, sort, view) over underline tabs; wall or list below; detail sheet and fullscreen poster overlays. */
:root{color-scheme:dark;--bg:#09090b;--ink:#f3eee6;--mute:#9a948c;--line:#ffffff14;--glass:#15151acc;--panel:#141418;--red:#ff3b30;--gold:#f6c343;
--hd:"Copperplate Gothic Bold","Copperplate Gothic","Copperplate","Marcellus SC",serif}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:110px}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#3a0d0b 0%,transparent 70%) no-repeat,var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid var(--line)}
.r1{display:flex;align-items:center;gap:6px;padding:10px max(3vw,14px) 4px;height:58px}
h1{font:700 clamp(20px,3.4vw,28px)/1 var(--hd);letter-spacing:.08em;margin:0 auto 0 0;white-space:nowrap;text-transform:uppercase}
h1 em{font-style:normal;color:var(--red)}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{background:#ffffff10}
.ib[aria-pressed=true]{background:#ffffff18}
.vt{display:flex;background:#ffffff0d;border-radius:12px;padding:2px}
.vt .ib{width:38px;height:38px;border-radius:10px;color:var(--mute)}.vt .ib[aria-pressed=true]{color:var(--ink);background:#ffffff1f}
.sr{display:none;flex:1;align-items:center;gap:6px;background:#ffffff10;border-radius:12px;padding:0 4px 0 12px;height:42px}
.sr input{flex:1;border:0;background:none;outline:0;font-size:16px;height:100%}
.bar.searching h1,.bar.searching .tools{display:none}.bar.searching .sr{display:flex}
.tools{display:flex;align-items:center;gap:2px}
.tabs{display:flex;gap:22px;padding:0 max(3vw,14px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 0 11px;color:var(--mute);font:700 13px/1 var(--hd);letter-spacing:.12em;text-transform:uppercase;position:relative}
.tab b{font:600 11px Inter,sans-serif;letter-spacing:0;margin-left:6px;color:#ffffff66}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--red)}
.prog{height:2px;background:#ffffff0a}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}
.info{padding:12px max(3vw,14px) 0;font-size:13px;color:var(--mute);min-height:20px}
/* wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;padding:10px max(3vw,10px) 80px}
@media(min-width:700px){.wall{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}}
.tile{position:relative;aspect-ratio:2/3;border:0;padding:0;border-radius:6px;overflow:hidden;background:#1b1b20;transition:transform .25s,box-shadow .25s}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 40px #000c;z-index:1}
.tile .bd{position:absolute;right:5px;top:5px;background:#000b;backdrop-filter:blur(6px);color:var(--gold);font:700 11px Inter,sans-serif;padding:3px 6px;border-radius:6px}
.tile .tt{position:absolute;inset:auto 0 0;padding:20px 7px 6px;background:linear-gradient(transparent,#000d);font:600 11px/1.2 Inter,sans-serif;text-align:left;opacity:0;transition:opacity .2s}
.tile:hover .tt,.tile:focus-visible .tt{opacity:1}
.nop{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font:700 13px var(--hd);color:var(--mute)}
/* list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:12px;padding:12px max(3vw,14px) 80px}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:12px;border-radius:16px;background:linear-gradient(180deg,#17171c,#111115);border:1px solid var(--line)}
.thumb{border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:2/3;background:#1b1b20;align-self:start;position:relative;box-shadow:0 8px 20px #0008}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.thumb:hover img{transform:scale(1.05)}
.ci{display:flex;flex-direction:column;gap:6px}
.ttl{border:0;background:none;padding:0;text-align:left;font:700 17px/1.2 var(--hd);letter-spacing:.04em;text-transform:uppercase}
.ttl:hover{color:#fff}
.meta{font-size:12.5px;color:var(--mute)}
.sc{display:flex;gap:16px;flex-wrap:wrap}
.s{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;white-space:nowrap}
.s svg{width:18px;height:18px}.s small{font-weight:500;font-size:11.5px;color:var(--mute)}.s.na{color:var(--mute);font-weight:500}
.syn{margin:0;font-size:13.5px;color:#d8d2c8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.lnk{margin-left:auto;font-size:12px;font-weight:700;color:var(--red);text-decoration:none;letter-spacing:.04em}
.stars{display:inline-flex}
.stars button,.stars span{border:0;background:none;padding:0;width:28px;height:32px;font-size:22px;line-height:1;color:#ffffff26}
.stars span{width:20px;font-size:17px}
.stars .on{color:var(--gold);text-shadow:0 0 12px #f6c34366}
.stars button:hover{transform:scale(1.15)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:70px 16px}
.empty b{display:block;font:700 22px var(--hd);letter-spacing:.08em;color:var(--ink);margin-bottom:6px;text-transform:uppercase}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:#000a;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.menu{position:fixed;z-index:41;right:max(3vw,10px);top:62px;width:min(320px,calc(100vw - 20px));background:#18181dee;backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 24px 60px #000c;display:none}
.menu.on{display:block}
.menu h3{font:700 11px var(--hd);letter-spacing:.14em;color:var(--mute);margin:10px 10px 6px;text-transform:uppercase}
.opt{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:none;padding:11px 12px;border-radius:10px;text-align:left;font-size:14.5px;min-height:44px}
.opt:hover{background:#ffffff0d}.opt[aria-checked=true]{color:#fff;font-weight:600}.opt[aria-checked=true]::after{content:"✓";color:var(--red)}
.sw{width:38px;height:22px;border-radius:11px;background:#ffffff26;position:relative;transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.opt[aria-checked=true] .sw{background:var(--red)}.opt[aria-checked=true] .sw::after{transform:translateX(16px)}.opt.tg::after{content:none!important}
.btnr{width:100%;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;min-height:46px;margin-top:6px}
/* detail */
.dt{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;pointer-events:none}
.dt.on{pointer-events:auto}
.dc{position:relative;width:min(920px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:linear-gradient(160deg,#1c1c22,#101013);border:1px solid var(--line);border-radius:24px;box-shadow:0 40px 120px #000;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);opacity:0;transform:scale(.94) translateY(10px);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.dt.on .dc{opacity:1;transform:none}
.dp{border:0;padding:0;background:#000;position:relative;cursor:zoom-in;min-height:100%}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
.dp .zm{position:absolute;right:10px;bottom:10px;background:#000a;border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.db{padding:28px 28px 24px;display:flex;flex-direction:column;gap:12px}
.db h2{margin:0;font:700 clamp(24px,3.6vw,34px)/1.08 var(--hd);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance;padding-right:40px}
.db .s{font-size:24px}.db .s svg{width:26px;height:26px}.db .s small{font-size:12px}
.db p{margin:0;font-size:15.5px;line-height:1.6;color:#e2dcd2}
.rate{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rate .stars button{width:40px;height:44px;font-size:32px}.rate .stars span{width:28px;font-size:24px}
.hint{font-size:12px;color:var(--mute)}
.x{position:absolute;right:12px;top:12px;z-index:2;background:#0009;backdrop-filter:blur(8px)}
.nav{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.nav button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--mute)}
.nav button:hover{color:var(--ink);background:#ffffff12}
@media(max-width:600px){.tabs{gap:16px}.tab{letter-spacing:.07em;font-size:12px}.tab b{margin-left:4px}}
@media(max-width:700px){.dt{padding:0;place-items:end center}.dc{grid-template-columns:1fr;border-radius:24px 24px 0 0;max-height:94dvh;transform:translateY(40px)}
 .dp{max-height:52dvh;overflow:hidden}.dp img{object-position:center 20%}.db{padding:20px 18px 24px}.card{grid-template-columns:86px minmax(0,1fr)}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:#000f;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s;cursor:zoom-out}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:100vw;max-height:100dvh;object-fit:contain}
.lb .x{position:fixed}
.lbcap{position:fixed;left:0;right:0;bottom:0;padding:24px 16px 18px;text-align:center;background:linear-gradient(transparent,#000c);font:700 14px var(--hd);letter-spacing:.1em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

_ai.jpg","lg":"https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p33824_p_v13_ai.jpg"},{"id":"t138","section":"again","title":"Heat","kind":"Movie","tm":84,"pop":94,"syn":"Master criminal Neil McCauley (Robert De Niro) is trying to control the rogue actions of one of his men, while also planning one last big heist before retiring.","rt":"https://www.rottentomatoes.com/m/heat_1995","year":1995,"date":"1995-12-15","sm":"https://resizing.flixster.com/JPgF_KAVzbKGphIEAhHmMG-5fGA=/206x305/v2/https://resizing.flixster.com/rWgbd-QkhYgxD45VbwanVX2_kgk=/ems.cHJkLWVtcy1hc3NldHMvbW92aWVzLzU4ZWMzMTAwLTVjZDQtNDAwMi1hMTY3LWI0MGY1ZTY2MjBmNS5qcGc=","lg":"https://resizing.flixster.com/rWgbd-QkhYgxD45VbwanVX2_kgk=/ems.cHJkLWVtcy1hc3NldHMvbW92aWVzLzU4ZWMzMTAwLTVjZDQtNDAwMi1hMTY3LWI0MGY1ZTY2MjBmNS5qcGc="},{"id":"t139","section":"again","title":"Enter the Void","kind":"Movie","tm":73,"pop":72,"syn":"A psychedelic acid trip in which a young man takes a wild journey into the afterlife. A visceral journey set against the thumping, neon club scene of Tokyo, which hurls into an astonishing trip through life and death.","rt":"https://www.rottentomatoes.com/m/enter_the_void","year":2009,"sm":"https://resizing.flixster.com/As0OUlZwbdHQlBPM1cFPtgiAGDw=/206x305/v2/https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p8072612_p_v8_aa.jpg","lg":"https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p8072612_p_v8_aa.jpg"},{"id":"t140","section":"again","title":"Femme Fatale","kind":"Movie","tm":49,"pop":49,"syn":"Laure (Rebecca Romijn-Stamos), a member of a crime ring, lifts an extravagant set of jewels from a model at a red carpet event. But instead of splitting the loot with her partners, Laure flees.","rt":"https://www.rottentomatoes.com/m/1118216-femme_fatale","year":2002,"date":"2002-11-06","sm":"https://resizing.flixster.com/XblITMlwjlAnNUk48dDUNFp6X1w=/206x305/v2/https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p30413_p_v8_af.jpg","lg":"https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p30413_p_v8_af.jpg"},{"id":"t141","section":"again","title":"Spun","kind":"Movie","tm":35,"pop":75,"syn":"A drug addict (Jason Schwartzman) meets an assortment of wild characters (John Leguizamo, Mena Suvari) while on a three-day speed binge in Los Angeles.","rt":"https://www.rottentomatoes.com/m/spun","year":2002,"sm":"https://resizing.flixster.com/etOFNh-FsSFvizYHvztU4z6cuL0=/206x305/v2/https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p31462_p_v10_ab.jpg","lg":"https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p31462_p_v10_ab.jpg"}]</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['again','Watch again'],['movies','Movies'],['shows','Shows'],['seen','Seen']];
const SORTS=[['pop','Audience score'],['tm','Critics score'],['new','Newest first'],['old','Oldest first'],['az','Title A–Z'],['za','Title Z–A'],['mine','My rating'],['cult','Cult factor (audience ≫ critics)'],['crit','Critics’ darlings (critics ≫ audience)']];
const TOM='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="9" fill="#fa320a"/><path d="M12 5.2c-1.6-2-3.6-2.3-5-1.8 1.2.5 2.2 1.3 2.8 2.4-1.6-.4-3.2 0-4.2.9 1.6 0 3 .5 4 1.3l2.4-1.2 2.4 1.2c1-.8 2.4-1.3 4-1.3-1-.9-2.6-1.3-4.2-.9.6-1.1 1.6-1.9 2.8-2.4-1.4-.5-3.4-.2-5 1.8z" fill="#00912d"/><ellipse cx="8.6" cy="11" rx="2" ry="1.3" fill="#fff" opacity=".35"/></svg>';
const POP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l-1.8 11.2a1 1 0 0 1-1 .8H7.8a1 1 0 0 1-1-.8z" fill="#fa320a"/><path d="M9 10.2l.6 11.6M15 10.2l-.6 11.6" stroke="#fff" stroke-width="1.6"/><g fill="#f5d36b"><circle cx="7.5" cy="8.5" r="2.6"/><circle cx="11" cy="6.8" r="2.9"/><circle cx="14.8" cy="7.4" r="2.7"/><circle cx="17" cy="9.2" r="2.1"/><circle cx="12.6" cy="9.4" r="2.2"/></g></svg>';
const X='<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
let S={tab:'movies',sort:'pop',view:'wall',hide:false,q:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('rqp')||'{}'),{q:''})}catch(e){}
let ITEMS=[],BY={},R={},owner=false,ref=null,CUR=[],di=-1,dId=null,noDb=false;
const save=()=>{try{localStorage.setItem('rqp',JSON.stringify({tab:S.tab,sort:S.sort,view:S.view,hide:S.hide}))}catch(e){}};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,'');
const key=t=>t.toLowerCase().replace(/^(the|a|an) /,'');
const rs=id=>(R[id]&&R[id].s)||0;
const sm=it=>it.sm,lg=it=>it.lg;
function sorter(a,b){
 const nl=(x,y,d)=>(x==null)-(y==null)||(x==null?0:d*(x-y));
 const dt=it=>it.date?+new Date(it.date):(it.year?+new Date(it.year+'-07-01'):null);
 const gap=it=>it.pop!=null&&it.tm!=null?it.pop-it.tm:null;
 switch(S.sort){
  case'pop':return nl(a.pop,b.pop,-1)||nl(a.tm,b.tm,-1);
  case'tm':return nl(a.tm,b.tm,-1)||nl(a.pop,b.pop,-1);
  case'new':return nl(dt(a),dt(b),-1);
  case'old':return nl(dt(a),dt(b),1);
  case'za':return key(b.title).localeCompare(key(a.title));
  case'mine':return nl(rs(a.id)||null,rs(b.id)||null,-1)||nl(a.pop,b.pop,-1);
  case'cult':return nl(gap(a),gap(b),-1);
  case'crit':return nl(gap(a),gap(b),1);
 }
 return key(a.title).localeCompare(key(b.title));
}
function current(){
 const q=norm(S.q);
 let l=q?ITEMS.filter(i=>norm(i.title).includes(q)):S.tab==='seen'?ITEMS.filter(i=>rs(i.id)):ITEMS.filter(i=>i.section===S.tab);
 if(S.hide&&S.tab!=='seen'&&!q)l=l.filter(i=>!rs(i.id));
 return l.sort(sorter);
}
const score=(v,ic,l)=>v==null?`<span class="s na">${ic}—<small>${l}</small></span>`:`<span class="s">${ic}${v}%<small>${l}</small></span>`;
function stars(it){
 const n=rs(it.id);
 if(owner){let h=`<span class="stars" role="group" aria-label="Rate ${esc(it.title)}">`;for(let i=1;i<=5;i++)h+=`<button data-rate="${i}" data-id="${it.id}" class="${i<=n?'on':''}" aria-label="${i} star${i>1?'s':''}">★</button>`;return h+'</span>'}
 if(!n)return'';let h=`<span class="stars" aria-label="${n} of 5 stars">`;for(let i=1;i<=5;i++)h+=`<span class="${i<=n?'on':''}">★</span>`;return h+'</span>'
}
const link=it=>it.rt&&it.rt.startsWith('https://')?`<a class="lnk" href="${esc(it.rt)}" target="_blank" rel="noopener">ROTTEN TOMATOES ↗</a>`:it.tmdb&&it.tmdb.startsWith('https://')?`<a class="lnk" href="${esc(it.tmdb)}" target="_blank" rel="noopener">MORE INFO ↗</a>`:'';
const meta=it=>esc([it.year,it.kind,it.section==='again'?'Watch again':''].filter(Boolean).join(' · '));
function tile(it){const n=rs(it.id);return`<button class="tile" data-open="${it.id}" aria-label="${esc(it.title)}">${it.sm?`<img src="${sm(it)}" alt="" loading="lazy" decoding="async">`:`<span class="nop">${esc(it.title)}</span>`}${n?`<span class="bd">★ ${n}</span>`:''}<span class="tt">${esc(it.title)}</span></button>`}
function card(it){return`<article class="card"><button class="thumb" data-zoom="${it.id}" aria-label="View poster fullscreen">${it.sm?`<img src="${sm(it)}" alt="" loading="lazy" decoding="async">`:`<span class="nop">${esc(it.title)}</span>`}</button><div class="ci">
 <button class="ttl" data-open="${it.id}">${esc(it.title)}</button><div class="meta">${meta(it)}</div>
 <div class="sc">${score(it.tm,TOM,'Critics')}${score(it.pop,POP,'Audience')}</div>
 ${it.syn?`<p class="syn">${esc(it.syn)}</p>`:''}<div class="foot">${stars(it)}${link(it)}</div></div></article>`}
function render(){
 const seen=ITEMS.filter(i=>rs(i.id)).length;
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${!S.q&&S.tab===k}">${l}<b>${k==='seen'?seen:ITEMS.filter(i=>i.section===k).length}</b></button>`).join('');
 $('#pg').style.width=(ITEMS.length?seen/ITEMS.length*100:0)+'%';
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
 $('#sorts').innerHTML=SORTS.map(([k,l])=>`<button class="opt" role="menuitemradio" data-sort="${k}" aria-checked="${S.sort===k}">${l}</button>`).join('');
 $('#hide').setAttribute('aria-checked',S.hide);
 CUR=current();
 const m=$('#main');m.className=S.view;
 const lbl=SORTS.find(s=>s[0]===S.sort)[1];
 $('#info').textContent=S.q?`${CUR.length} result${CUR.length===1?'':'s'} across all tabs`:`${CUR.length} title${CUR.length===1?'':'s'} · ${lbl}${S.hide&&S.tab!=='seen'?' · hiding seen':''}`;
 if(!CUR.length){m.innerHTML=S.tab==='seen'&&!S.q?`<div class="empty"><b>Nothing seen yet</b>${owner?'Rate a title with stars and it lands here.':'Titles show up here once Ryan rates them.'}</div>`:`<div class="empty"><b>No matches</b>${S.q?'Nothing matches “'+esc(S.q)+'”.':'Everything here is hidden by the filter.'}</div>`;return}
 m.innerHTML=CUR.map(S.view==='wall'?tile:card).join('');
}
/* detail */
function detail(i){
 di=i;const it=CUR[i];if(!it)return;dId=it.id;
 $('#dc').innerHTML=`<button class="ib x" data-close aria-label="Close">${X}</button>
 <button class="dp" data-zoom="${it.id}" aria-label="View poster fullscreen">${it.sm?`<img src="${lg(it)}" alt="">`:`<span class="nop">${esc(it.title)}</span>`}<span class="zm"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span></button>
 <div class="db"><div class="meta">${meta(it)}</div><h2>${esc(it.title)}</h2>
 <div class="sc">${score(it.tm,TOM,'Critics')}${score(it.pop,POP,'Audience')}</div>
 ${it.syn?`<p>${esc(it.syn)}</p>`:''}
 ${owner||rs(it.id)?`<div class="rate">${stars(it)}<span class="hint">${owner?(rs(it.id)?'Seen · tap the same star to clear':'Not seen yet · tap a star to rate'):'Ryan’s rating'}</span></div>`:`<div class="rate"><span class="hint">Not seen yet</span></div>`}
 <div>${link(it)}</div>
 <div class="nav"><button data-step="-1" ${i<1?'disabled':''}>‹ Previous</button><button data-step="1" ${i>=CUR.length-1?'disabled':''}>Next ›</button></div></div>`;
 if(!$('#dt').classList.contains('on')){$('#dt').classList.add('on');$('#scrim').classList.add('on');document.body.style.overflow='hidden';setTimeout(()=>$('#dc .x')?.focus({preventScroll:true}),50)}
 $('#dc').scrollTop=0;
}
function closeDetail(){$('#dt').classList.remove('on');$('#scrim').classList.remove('on');document.body.style.overflow='';const t=dId&&document.querySelector(`[data-open="${dId}"]`);di=-1;dId=null;t?.focus({preventScroll:true})}
function zoom(id){const it=BY[id];if(!it||!it.lg)return;$('#lbi').src=lg(it);$('#lbc').textContent=it.title;$('#lb').classList.add('on');document.body.style.overflow='hidden'}
function closeZoom(){$('#lb').classList.remove('on');if(!$('#dt').classList.contains('on'))document.body.style.overflow=''}
function menu(on){$('#menu').classList.toggle('on',on);$('#ms').setAttribute('aria-pressed',on)}
async function rate(id,v){
 if(!ref||!owner)return;
 const prev=R[id],next=rs(id)===v?null:{s:v,at:Date.now()};
 R={...R};if(next)R[id]=next;else delete R[id];render();if(di>=0)refreshDetail(id);
 try{next?await ref.doc(id).set(next):await ref.doc(id).delete()}catch(e){R={...R};if(prev)R[id]=prev;else delete R[id];render();if(di>=0)refreshDetail(id);$('#info').textContent='Couldn’t save that rating. Try again.'}
}
function refreshDetail(id){const j=CUR.findIndex(x=>x.id===id);if(j>=0)detail(j);else{const it=BY[id];CUR.splice(di,0,it);detail(di)}}
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a,#scrim');
 if(!t){if(!e.target.closest('#menu'))menu(false);return}
 if(t.closest('#lb')||t===$('#lb')){closeZoom();return}
 if(t.id==='scrim'){closeDetail();menu(false);return}
 const d=t.dataset;
 if(d.rate){rate(d.id,+d.rate);return}
 if(d.zoom){zoom(d.zoom);return}
 if(d.open){menu(false);detail(CUR.findIndex(x=>x.id===d.open));return}
 if('close' in d){closeDetail();return}
 if(d.step){detail(Math.max(0,Math.min(CUR.length-1,di+ +d.step)));return}
 if(d.tab){S.tab=d.tab;S.q='';$('#q').value='';$('#bar').classList.remove('searching');save();render();scrollTo({top:0});return}
 if(d.view){S.view=d.view;save();render();return}
 if(d.sort){S.sort=d.sort;save();menu(false);render();return}
 if(t.id==='ms'){menu(!$('#menu').classList.contains('on'));return}
 if(t.id==='hide'){S.hide=!S.hide;save();render();return}
 if(t.id==='pick'){menu(false);const pool=CUR.filter(i=>!rs(i.id));if(!pool.length){$('#info').textContent='Nothing unseen left here.';return}const it=pool[Math.floor(Math.random()*pool.length)];detail(CUR.indexOf(it));return}
 if(t.id==='qs'){$('#bar').classList.add('searching');$('#q').focus();return}
 if(t.id==='qx'){S.q='';$('#q').value='';$('#bar').classList.remove('searching');render();return}
 if(!t.closest('#menu'))menu(false);
});
document.addEventListener('pointerdown',e=>{if(e.target===$('#dt'))closeDetail()});
$('#lbi').addEventListener('click',closeZoom);
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#lb').classList.contains('on'))closeZoom();else if(di>=0)closeDetail();else if($('#menu').classList.contains('on'))menu(false);else if(S.q||$('#bar').classList.contains('searching'))$('#qx').click()}
 if(di>=0&&!$('#lb').classList.contains('on')&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))detail(Math.max(0,Math.min(CUR.length-1,di+(e.key==='ArrowRight'?1:-1))));
});
let tx=null;
$('#dc').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#dc').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70)detail(Math.max(0,Math.min(CUR.length-1,di+(dx<0?1:-1))))},{passive:true});
try{const d=JSON.parse(document.getElementById('rml-data').textContent);ITEMS=d;d.forEach(i=>BY[i.id]=i);render()}catch(e){$('#main').innerHTML='<div class="empty"><b>Couldn’t load</b>Reload the page to try again.</div>'}
render();
(async()=>{
 const load=async()=>{
  try{
   const r=await fetch('https://shop.ryryart.com/api/2025-07/graphql.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'{ page(handle:"rysmovielist-ratings"){ body } }'})});
   const j=await r.json();const html=j&&j.data&&j.data.page&&j.data.page.body||'';
   const txt=new DOMParser().parseFromString(html,'text/html').body.textContent.trim();
   const m=JSON.parse(txt||'{}'),o={};
   for(const k in m){const v=m[k];if(/^t\d{3}$/.test(k)&&Number.isInteger(v)&&v>=1&&v<=5)o[k]={s:v}}
   const changed=JSON.stringify(o)!==JSON.stringify(R);R=o;
   if(changed){render();if(di>=0&&dId)refreshDetail(dId)}
  }catch(e){}
 };
 await load();setInterval(()=>{if(!document.hidden)load()},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
}
</script>
